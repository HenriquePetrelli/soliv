      /* Tela de abertura desenhada pelo próprio HTML: aparece assim que a
         página chega, sem esperar o JavaScript (que no celular leva alguns
         segundos para baixar e rodar). O React substitui este conteúdo ao
         montar o app. Mesmas cores e logo da SplashScreen. */
      #app-shell { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: #F9FAFB; }
      #app-shell img { height: 96px; width: auto; }
      #app-shell .bar { height: 4px; width: 96px; overflow: hidden; border-radius: 9999px; background: #E5E7EB; }
      #app-shell .bar::after { content: ''; display: block; height: 100%; width: 50%; border-radius: 9999px; background: #7C3BED; animation: app-shell-bar 1.2s ease-in-out infinite; }
      @keyframes app-shell-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
      @media (prefers-color-scheme: dark) {
        #app-shell { background: #2A2537; }
        #app-shell .bar { background: #3A3449; }
        #app-shell .bar::after { background: #A78BFA; }
      }
      @media (prefers-reduced-motion: reduce) { #app-shell .bar::after { animation: none; transform: translateX(50%); } }
    </style>
